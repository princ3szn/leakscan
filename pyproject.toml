[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leakscan"
version = "0.1.0"
description = "Secrets and credential leak scanner"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.setuptools.package-data]
leakscan = ["rules/*.toml"]
[project.scripts]
leakscan = "leakscan.cli:main"